<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Welcome to Kayak | Amira Beaubrun, 2025</title>

<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<style type="text/css">
body {
    margin: 0;
    padding: 0;
    background-color: #FC996D;
    font-family: Arial, Helvetica, sans-serif;
}
wrapper {
    display: block;
    width: 1366px;
    margin: 20px auto;
    background-color: #FFFFFF;
    min-height: 1024px;
}
header {
    padding: 20px 30px 10px;
}
header h1 {
    margin: 0;
    font-size: 32px;
}
header p {
    margin: 4px 0 0;
    font-size: 14px;
}
main {
    padding: 10px 30px 30px;
}
footer {
    padding: 16px 30px 32px;
    font-size: 11px;
    line-height: 1.4;
    color: #555555;
}
#Tabs1 {
    width: 1366px;
    border: none;
    background: none;
}
#Tabs1 ul {
    list-style: none;
    margin: 0 0 10px 0;
    padding: 0;
    text-align: center;
}
#Tabs1 ul li {
    display: inline-block;
    background-color: #FFE1D1;
    border-radius: 12px 12px 0 0;
    margin: 0 4px;
    padding: 6px 12px 4px;
}
#Tabs1 ul li a {
    text-decoration: none;
    color: #1E2330;
    font-size: 13px;
    font-weight: bold;
    display: block;
}
#Tabs1 ul li a img {
    height: 70px;
    width: auto;
    display: block;
    margin: 0 auto 4px;
}
#Tabs1 ul li.ui-tabs-active {
    background-color: #FFFFFF;
}
#Tabs1 ul li:hover {
    background-color: #FFD0B4;
    cursor: pointer;
}
#Tabs1 .ui-tabs-panel {
    background-color: #FFFFFF;
    border-radius: 0 12px 12px 12px;
    border: 1px solid #E5E5E5;
    padding: 24px 24px 30px;
}
.flex-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: flex-end;
}
.search-row input,
.search-row select {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #CCCCCC;
    font-size: 13px;
    margin-right: 8px;
    margin-bottom: 8px;
    min-width: 160px;
}
.btn-primary {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background-color: #FF6B35;
    color: #FFFFFF;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}
.btn-primary:hover {
    background-color: #E15422;
}
</style>

</head>

<body onLoad="MM_preloadImages('airplane-hover.png','hotel-hover.png','car-hover.png','camera-hover.png','cruise-hover.png')">

          <div class="search-row">
